<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo Interactivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🏛️ Museo Interactivo</h1>
        <p>Experiencia de arte, IA y tecnología.</p>
    </header>

    <main>

        <!-- INTEGRANTE 1 -->
        <section id="modelos3d">
        <h2>Arte y Modelos 3D (Integrante 1)</h2>

        <iframe 
            src="https://gualter302.github.io/HombreMaquina_web/" 
            style="width: 100%; height: 600px; border: none; border-radius: 8px;">
        </iframe>
        </section>


        <!-- INTEGRANTE 2 (Chatbot) -->
        <section id="chatbot">
            <h2>🙋 Tu Guía Virtual (Integrante 2)</h2>

            <p id="chatbot-status">
                El Chatbot está bloqueado. Sonríe 😄 o muestra 👍 frente a la cámara.
            </p>

            <!-- Contenedor donde aparecerá el chatbot al desbloquear -->
            <div id="chatbot-contenedor" style="display:none;"></div>
        </section>

        <!-- INTEGRANTE 3 (IA + Cámara) -->
        <section id="tracking">
            <h2>📸 Cámara y Gestos (Integrante 3)</h2>

            <div id="video-contenedor">
                <video id="webcam" autoplay playsinline></video>
            </div>

            <p id="feedback-gesto">Cargando modelos IA...</p>
        </section>

    </main>

    <footer>
        <p>&copy; Proyecto Interactivo 2025</p>
    </footer>

    <!-- IA (ESM) -->
    <script type="module" src="script.js"></script>
</body>
</html>
