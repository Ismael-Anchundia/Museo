<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo Interactivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- MENSAJE EMERGENTE -->
    <div id="mensaje-sonrisa">Sonrisa detectada ✔</div>

    <header>
        <h1>🏛️ Museo Interactivo</h1>
        <p>Experiencia de arte y tecnología.</p>
    </header>

    <main>

        <!-- =======================
             ENTORNO 3D
        ======================== -->
        <section id="modelos3d">
            <h2>Museo, entorno 3D</h2>

            <div id="entorno-wrapper">
                <div id="entorno-topbar">
                    <button id="btn-max" title="Maximizar">⤢</button>
                    <button id="btn-min" title="Restaurar" style="display:none;">⤡</button>
                </div>

                <div id="entorno-scaler">
                    <iframe id="entorno-iframe" src=""></iframe>
                </div>
            </div>
        </section>

        <!-- MENSAJE INICIAL -->
        <section id="mensaje-inicial">
            😄 <b>Sonríe para activar el asistente virtual</b>
        </section>

        <!-- TRACKING (CÁMARA) -->
        <section id="tracking" style="display:none;">
            <div id="video-contenedor">
                <video id="webcam" autoplay playsinline></video>
            </div>
        </section>

        <!-- =======================
             SECCIÓN DE CÓDIGOS QR
        ======================== -->
        <section id="qr-section">
            <h2>🎨 Acceso a la Animación AR</h2>

            <p class="qr-desc">
                Escanea este código para ver la estatua animada en 3D y Realidad Aumentada.
            </p>

            <div class="qr-container">
                <div class="qr-item">
                    <img src="qr/qr_animacion_ar.png" alt="QR Animación AR">
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; Proyecto Interactivo 2025</p>
    </footer>

    <!-- Chatbot flotante -->
    <div id="chatbot-flotante" style="display:none;"></div>

    <!-- Burbuja minimizada -->
    <div id="chatbot-burbuja" style="display:none;">
        <img src="https://cdn-icons-png.flaticon.com/512/134/134914.png" alt="Chatbot">
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
