<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo Interactivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- MENSAJE EMERGENTE -->
    <div id="mensaje-sonrisa">Sonrisa detectada ✔</div>

    <header>
        <h1>🏛️ Museo Interactivo</h1>
        <p>Experiencia de arte y tecnología.</p>
    </header>

    <main>

        <!-- INTEGRANTE 1 -->
        <section id="modelos3d">
            <h2>Museo, entorno 3D</h2>

            <iframe 
                src="https://gualter302.github.io/HombreMaquina_web/" 
                style="width: 100%; height: 85vh; border: none; border-radius: 8px;">
            </iframe>

        </section>

        <!-- MENSAJE INICIAL UNIFICADO -->
        <section id="mensaje-inicial">
            😄 <b>Sonríe para activar el asistente virtual</b>
        </section>

        <!-- INTEGRANTE 2 (Chatbot) — OCULTO POR DEFECTO -->
        <section id="chatbot" style="display:none;">
            <h2>🙋 Tu Guía Virtual (Integrante 2)</h2>
        </section>

        <!-- INTEGRANTE 3 (IA + Cámara) — OCULTO POR DEFECTO -->
        <section id="tracking" style="display:none;">
            <h2>📸 Cámara y Gestos (Integrante 3)</h2>

            <div id="video-contenedor">
                <video id="webcam" autoplay playsinline></video>
            </div>

            <p id="feedback-gesto">Cargando modelos IA...</p>
        </section>

    </main>

    <footer>
        <p>&copy; Proyecto Interactivo 2025</p>
    </footer>

    <!-- Chatbot flotante -->
    <div id="chatbot-flotante" style="display:none;"></div>

    <!-- Burbuja minimizada -->
    <div id="chatbot-burbuja" style="display:none;">
        <img src="https://cdn-icons-png.flaticon.com/512/134/134914.png">
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
